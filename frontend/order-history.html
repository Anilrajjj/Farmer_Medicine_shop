<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - Farmer Medicine Shop</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #f4f4f9;
    }

    .orders-page {
      max-width: 860px;
      margin: 30px auto;
      padding: 0 16px 60px;
    }

    .orders-page h1 {
      font-size: 26px;
      color: #2e7d32;
      margin-bottom: 24px;
    }

    /* ===== ORDER CARD ===== */
    .order-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
      overflow: hidden;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #f8fff8;
      border-bottom: 1px solid #e8f5e9;
      flex-wrap: wrap;
      gap: 10px;
    }

    .order-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .order-id {
      font-weight: 700;
      color: #2e7d32;
      font-size: 15px;
    }

    .order-date {
      color: #888;
      font-size: 13px;
    }

    .order-status-badge {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .badge-pending {
      background: #fff3cd;
      color: #856404;
    }

    .badge-processing {
      background: #cce5ff;
      color: #004085;
    }

    .badge-shipped {
      background: #d1ecf1;
      color: #0c5460;
    }

    .badge-delivered {
      background: #d4edda;
      color: #155724;
    }

    .badge-cancelled {
      background: #f8d7da;
      color: #721c24;
    }

    /* ===== TRACKING TIMELINE ===== */
    .tracking-section {
      padding: 24px 20px 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    .tracking-section h4 {
      margin: 0 0 18px;
      font-size: 14px;
      color: #555;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .timeline {
      display: flex;
      align-items: flex-start;
      position: relative;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .timeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 90px;
      position: relative;
      text-align: center;
    }

    /* Connector line between steps */
    .timeline-step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 16px;
      left: 50%;
      width: 100%;
      height: 3px;
      background: #ddd;
      z-index: 0;
      transition: background 0.4s;
    }

    .timeline-step.done:not(:last-child)::after {
      background: #2e7d32;
    }

    .step-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid #ddd;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      position: relative;
      z-index: 1;
      transition: all 0.3s;
    }

    .timeline-step.done .step-dot {
      border-color: #2e7d32;
      background: #2e7d32;
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.15);
    }

    .timeline-step.active .step-dot {
      border-color: #ff9f00;
      background: #ff9f00;
      box-shadow: 0 0 0 4px rgba(255, 159, 0, 0.2);
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    .step-icon {
      font-size: 15px;
    }

    .step-label {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      line-height: 1.3;
    }

    .timeline-step.done .step-label {
      color: #2e7d32;
    }

    .timeline-step.active .step-label {
      color: #e65c00;
      font-weight: 700;
    }

    .step-date {
      font-size: 10px;
      color: #bbb;
      margin-top: 3px;
    }

    .timeline-step.done .step-date {
      color: #81c784;
    }

    .timeline-step.active .step-date {
      color: #ff9f00;
    }

    /* ===== ORDER ITEMS ===== */
    .order-items-section {
      padding: 16px 20px;
    }

    .order-item-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid #f5f5f5;
    }

    .order-item-row:last-child {
      border-bottom: none;
    }

    .order-item-img {
      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #eee;
      flex-shrink: 0;
    }

    .order-item-info {
      flex: 1;
    }

    .order-item-info .i-name {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .order-item-info .i-qty {
      font-size: 13px;
      color: #888;
      margin-top: 2px;
    }

    .order-item-price {
      font-size: 14px;
      font-weight: 700;
      color: #2e7d32;
    }

    /* ===== ORDER FOOTER ===== */
    .order-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
      flex-wrap: wrap;
      gap: 10px;
    }

    .order-total-label {
      font-size: 16px;
      font-weight: 700;
      color: #222;
    }

    .order-total-amount {
      color: #2e7d32;
      font-size: 18px;
    }

    .order-footer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: #fff3cd;
      color: #856404;
    }

    .btn-cancel:hover {
      background: #ffe082;
    }

    .btn-delete {
      background: #ffebee;
      color: #c62828;
    }

    .btn-delete:hover {
      background: #ffcdd2;
    }

    /* ===== ADDRESS BOX ===== */
    .address-box {
      margin: 0 20px 16px;
      padding: 12px 16px;
      background: #f8fff8;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      line-height: 1.7;
    }

    .address-box strong {
      color: #2e7d32;
      display: block;
      margin-bottom: 2px;
    }

    /* ===== EMPTY / LOADING ===== */
    .state-box {
      text-align: center;
      padding: 60px 20px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .state-box .s-icon {
      font-size: 60px;
      margin-bottom: 14px;
      display: block;
    }

    .state-box h2 {
      color: #333;
      margin-bottom: 8px;
    }

    .state-box p {
      color: #888;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .btn-shop {
      display: inline-block;
      padding: 12px 28px;
      background: #2e7d32;
      color: #fff;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-shop:hover {
      background: #1b5e20;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e0e0e0;
      border-top-color: #2e7d32;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 500px) {
      .timeline-step {
        min-width: 70px;
      }

      .step-label {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">🌿 Farmer Medicine Shop</div>
    <div class="nav-links">
      <a href="./">Home</a>
      <a href="./about.html">About Us</a>
      <a href="./cart.html">Cart 🛒</a>
      <a href="./order-history.html" class="active">My Orders</a>
      <a href="./login.html" id="login-link">Login</a>
      <a href="javascript:void(0)" onclick="logoutUser()" id="logout-link" style="display:none;">Logout</a>
    </div>
  </header>

  <div class="orders-page">
    <h1>📦 My Orders</h1>

    <div id="orders-container">
      <!-- Loading spinner -->
      <div class="state-box" id="loading-box">
        <div class="spinner"></div>
        <p>Loading your orders...</p>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 Farmer Medicine Shop | Designed with ❤️ for Farmers</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="script.js"></script>
  
  <script>
    // ============================================================
    // ORDER TRACKING STEPS DEFINITION
    // ============================================================
    const TRACK_STEPS = [
      { key: 'Pending', icon: '🛒', label: 'Order\nPlaced' },
      { key: 'Processing', icon: '📦', label: 'Packing' },
      { key: 'Shipped', icon: '🚚', label: 'Shipped' },
      { key: 'OutForDelivery', icon: '🏃', label: 'Out for\nDelivery' },
      { key: 'Delivered', icon: '✅', label: 'Delivered' },
    ];

    // Map order status to step index (0-based)
    const STATUS_STEP = {
      'Pending': 0,
      'Processing': 1,
      'Shipped': 2,
      'OutForDelivery': 3,
      'Delivered': 4,
      'Cancelled': -1
    };

    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      if (!isUserLoggedIn()) {
        alert('⚠️ Please login to view your orders.');
        window.location.href = 'login.html';
        return;
      }
      loadOrders();
    });

    async function loadOrders() {
      const container = document.getElementById('orders-container');
      try {
        const orders = await apiRequest('/orders/my-orders');

        if (!orders || orders.length === 0) {
          container.innerHTML = `
            <div class="state-box">
              <span class="s-icon">🛒</span>
              <h2>No Orders Yet</h2>
              <p>You haven't placed any orders yet. Start shopping!</p>
              <a href="./" class="btn-shop">Shop Now</a>
            </div>`;
          return;
        }

        container.innerHTML = '';
        orders.forEach(order => container.appendChild(buildOrderCard(order)));

      } catch (err) {
        container.innerHTML = `
          <div class="state-box">
            <span class="s-icon">⚠️</span>
            <h2>Could not load orders</h2>
            <p>${err.message}</p>
            <a href="./" class="btn-shop">Go Home</a>
          </div>`;
      }
    }

    // ---- Build a full order card with tracking timeline ----
    function buildOrderCard(order) {
      const card = document.createElement('div');
      card.className = 'order-card';

      const date = new Date(order.createdAt).toLocaleDateString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric'
      });

      const statusClass = `badge-${order.status.toLowerCase()}`;
      const activeStep = STATUS_STEP[order.status] ?? 0;
      const cancelled = order.status === 'Cancelled';

      // ---- Timeline HTML ----
      const timelineHTML = cancelled
        ? `<div style="padding:10px 0; color:#c62828; font-weight:600; font-size:14px;">
             ❌ This order was cancelled.
           </div>`
        : TRACK_STEPS.map((step, i) => {
          const isDone = i < activeStep;
          const isActive = i === activeStep;
          const cls = isDone ? 'done' : isActive ? 'active' : '';
          return `
              <div class="timeline-step ${cls}">
                <div class="step-dot">
                  <span class="step-icon">${isDone ? '✓' : step.icon}</span>
                </div>
                <div class="step-label">${step.label.replace('\n', '<br>')}</div>
                ${isActive ? `<div class="step-date">In Progress</div>` : isDone ? `<div class="step-date">Done</div>` : `<div class="step-date"></div>`}
              </div>`;
        }).join('');

      // ---- Items HTML ----
      const itemsHTML = order.items.map(item => `
        <div class="order-item-row">
          <img src="${item.image}" alt="${item.name}" class="order-item-img" onerror="this.src='images/placeholder.png'" />
          <div class="order-item-info">
            <div class="i-name">${item.name}</div>
            <div class="i-qty">Qty: ${item.quantity} × ₹${item.price}</div>
          </div>
          <div class="order-item-price">₹${item.price * item.quantity}</div>
        </div>`).join('');

      // ---- Actions ----
      let actionsHTML = '';
      if (order.status === 'Pending') {
        actionsHTML = `<button class="btn-action btn-cancel" onclick="cancelOrder('${order._id}')">Cancel Order</button>`;
      } else if (order.status === 'Cancelled') {
        actionsHTML = `<button class="btn-action btn-delete" onclick="deleteOrder('${order._id}')">Delete</button>`;
      }

      card.innerHTML = `
        <!-- Header -->
        <div class="order-header">
          <div class="order-meta">
            <div class="order-id">Order #${order._id.slice(-8).toUpperCase()}</div>
            <div class="order-date">Placed on ${date} &bull; ${order.paymentMethod || 'COD'}</div>
          </div>
          <span class="order-status-badge ${statusClass}">${order.status}</span>
        </div>

        <!-- Tracking Timeline -->
        <div class="tracking-section">
          <h4>📍 Order Tracking</h4>
          <div class="timeline">${timelineHTML}</div>
        </div>

        <!-- Delivery Address -->
        <div class="address-box">
          <strong>📦 Delivering to:</strong>
          ${order.shippingAddress.fullName} &bull; ${order.shippingAddress.phone}<br>
          ${order.shippingAddress.area}${order.shippingAddress.landmark ? ', ' + order.shippingAddress.landmark : ''}, ${order.shippingAddress.pincode}
        </div>

        <!-- Items -->
        <div class="order-items-section">${itemsHTML}</div>

        <!-- Footer: Total + Actions -->
        <div class="order-footer">
          <div class="order-total-label">
            Total: <span class="order-total-amount">₹${order.totalAmount}</span>
          </div>
          <div class="order-footer-actions">${actionsHTML}</div>
        </div>
      `;

      return card;
    }

    // ---- Cancel order ----
    async function cancelOrder(orderId) {
      if (!confirm('Cancel this order?')) return;
      try {
        await apiRequest(`/orders/${orderId}/cancel`, { method: 'PATCH' });
        loadOrders();
      } catch (e) { alert('Error: ' + e.message); }
    }

    // ---- Delete order ----
    async function deleteOrder(orderId) {
      if (!confirm('Permanently delete this cancelled order?')) return;
      try {
        await apiRequest(`/orders/${orderId}`, { method: 'DELETE' });
        loadOrders();
      } catch (e) { alert('Error: ' + e.message); }
    }
  </script>
</body>

</html>
