<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Farmer Medicine Shop</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ===== PRODUCT DETAIL PAGE ===== */
        .detail-wrapper {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .breadcrumb {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
        }

        .breadcrumb a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb span {
            margin: 0 6px;
        }

        .detail-card {
            display: flex;
            gap: 40px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
            flex-wrap: wrap;
        }

        /* --- Image Panel --- */
        .detail-image-panel {
            flex: 0 0 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .detail-main-image {
            width: 300px;
            height: 300px;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid #e8f5e9;
            background: #f9f9f9;
            padding: 10px;
            transition: transform 0.3s;
        }

        .detail-main-image:hover {
            transform: scale(1.04);
        }

        /* --- Info Panel --- */
        .detail-info-panel {
            flex: 1;
            min-width: 280px;
        }

        .detail-category-badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-name {
            font-size: 26px;
            font-weight: 700;
            color: #222;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }

        .detail-rating {
            color: #f5a623;
            font-size: 18px;
            margin-bottom: 14px;
        }

        .detail-rating span {
            font-size: 14px;
            color: #777;
            margin-left: 6px;
        }

        .detail-price-block {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .detail-price {
            font-size: 32px;
            font-weight: 800;
            color: #2e7d32;
        }

        .detail-original-price {
            font-size: 18px;
            color: #aaa;
            text-decoration: line-through;
        }

        .detail-discount-badge {
            background: #ff6f00;
            color: white;
            font-size: 13px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 4px;
        }

        .detail-stock {
            font-size: 14px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .detail-stock.in-stock {
            color: #2e7d32;
        }

        .detail-stock.out-stock {
            color: #c62828;
        }

        .detail-desc {
            font-size: 15px;
            color: #555;
            line-height: 1.7;
            margin-bottom: 22px;
            padding: 14px;
            background: #f4f4f9;
            border-left: 4px solid #2e7d32;
            border-radius: 0 8px 8px 0;
        }

        /* --- Quantity Selector --- */
        .quantity-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .quantity-row label {
            font-weight: 600;
            font-size: 15px;
            color: #333;
        }

        .qty-control {
            display: flex;
            align-items: center;
            border: 2px solid #c8e6c9;
            border-radius: 8px;
            overflow: hidden;
        }

        .qty-control button {
            background: #e8f5e9;
            border: none;
            padding: 8px 14px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            color: #2e7d32;
            transition: background 0.2s;
            line-height: 1;
        }

        .qty-control button:hover {
            background: #c8e6c9;
        }

        .qty-control input {
            width: 48px;
            text-align: center;
            border: none;
            font-size: 16px;
            font-weight: 700;
            outline: none;
            background: white;
            color: #333;
        }

        /* --- Action Buttons --- */
        .detail-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-add-cart {
            flex: 1;
            min-width: 160px;
            padding: 14px 20px;
            background: #ff9f00;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add-cart:hover {
            background: #e65c00;
            transform: translateY(-2px);
        }

        .btn-buy-now {
            flex: 1;
            min-width: 160px;
            padding: 14px 20px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-buy-now:hover {
            background: #1b5e20;
            transform: translateY(-2px);
        }

        /* --- Info Tags --- */
        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #eee;
        }

        .detail-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #555;
            background: #f0f0f0;
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* --- Loading Skeleton --- */
        .skeleton-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            padding: 30px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .skeleton-img {
            width: 300px;
            height: 300px;
            background: #e0e0e0;
            border-radius: 12px;
        }

        .skeleton-text {
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .detail-error {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
        }

        .detail-error .err-icon {
            font-size: 60px;
        }

        .detail-error h2 {
            color: #c62828;
        }

        .detail-error p {
            color: #777;
            margin-bottom: 20px;
        }

        .detail-error a {
            display: inline-block;
            padding: 12px 28px;
            background: #2e7d32;
            color: white;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2e7d32;
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 640px) {
            .detail-card {
                flex-direction: column;
            }

            .detail-image-panel {
                flex: unset;
                width: 100%;
            }

            .detail-main-image {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">🌿 Farmer Medicine Shop</div>
        <div class="nav-links">
            <a href="./">Home</a>
            <a href="./about.html">About Us</a>
            <a href="./cart.html">Cart 🛒 <span id="nav-cart-count"></span></a>
            <a href="./order-history.html" id="orders-link" style="display:none;">My Orders</a>
            <a href="./admin.html" id="admin-link" style="display:none;">Admin</a>
            <a href="./login.html" id="login-link">Login</a>
            <a href="javascript:void(0)" onclick="logoutUser()" id="logout-link" style="display:none;">Logout</a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="detail-wrapper">

        <!-- Breadcrumb -->
        <div class="breadcrumb" id="breadcrumb">
            <a href="./">Home</a>
            <span>›</span>
            <span id="bc-category">Products</span>
            <span>›</span>
            <span id="bc-name">Loading...</span>
        </div>

        <!-- Detail Container -->
        <div id="detail-container">
            <!-- Skeleton loader shown first -->
            <div class="skeleton-card" id="skeleton">
                <div class="skeleton-img"></div>
                <div style="flex:1; min-width:280px;">
                    <div class="skeleton-text" style="height:16px; width:80px;"></div>
                    <div class="skeleton-text" style="height:32px; width:70%; margin-top:10px;"></div>
                    <div class="skeleton-text" style="height:18px; width:40%;"></div>
                    <div class="skeleton-text" style="height:40px; width:50%; margin-top:20px;"></div>
                    <div class="skeleton-text" style="height:80px; width:100%; margin-top:20px;"></div>
                    <div class="skeleton-text" style="height:50px; width:100%; margin-top:20px;"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Footer -->
    <footer>
        <p>© 2025 Farmer Medicine Shop | Designed with ❤️ for Farmers</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="script.js"></script>
    <script src="js/product-detail.js"></script>
    

</body>

</html>
